<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <linearGradient id="neonBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="glowG" cx="20%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowP" cx="80%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#00E599" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowG)" />
  <rect width="1200" height="630" fill="url(#glowP)" />

  <!-- Subtle Cyber Matrix Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Brand Badge Icon -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="84" height="84" rx="22" fill="#0D131F" stroke="url(#neonBrand)" stroke-width="2.5" />
    <path d="M30 42 L21 34 L30 26 M54 42 L63 34 L54 26 M45 22 L39 46" 
          stroke="url(#neonBrand)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="translate(0, 8)" />
  </g>

  <!-- Brand Name Pill -->
  <g transform="translate(205, 122)">
    <rect width="210" height="40" rx="20" fill="rgba(0, 229, 153, 0.08)" stroke="rgba(0, 229, 153, 0.25)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4.5" fill="#00E599" />
    <text x="35" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00E599" letter-spacing="2">SYSENG ACADEMY</text>
  </g>

  <!-- Main Headline Title -->
  <text x="100" y="260" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
    Aprende Programación e
  </text>
  <text x="100" y="325" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#neonBrand)" letter-spacing="-1.5">
    Ingeniería de Software
  </text>

  <!-- Subtitle -->
  <text x="100" y="390" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Rutas de aprendizaje interactivas, retos de código en tiempo real y asistente con inteligencia artificial.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 445)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="48" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="24" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">⚡ Rutas Profesionales</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(260, 0)">
      <rect width="240" height="48" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="24" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">💻 CodeLab en Vivo</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(520, 0)">
      <rect width="220" height="48" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="24" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">🤖 Byte IA Mentor</text>
    </g>
  </g>

  <!-- URL Bottom Bar -->
  <g transform="translate(100, 560)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="500" fill="#64748B" letter-spacing="1">
      https://www.sysengacademy.site
    </text>
  </g>
</svg>
