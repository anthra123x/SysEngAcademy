<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121E"/>
      <stop offset="50%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0AE98A"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Radial Background Center Glow -->
  <circle cx="256" cy="256" r="140" fill="#0AE98A" fill-opacity="0.08" filter="blur(30px)"/>

  <!-- Code Symbol Group -->
  <g filter="url(#neonGlow)">
    <!-- Left Bracket < -->
    <path d="M 180 180 L 110 256 L 180 332" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Slash / -->
    <line x1="280" y1="160" x2="232" y2="352" 
          stroke="#00D9FF" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Right Bracket > -->
    <path d="M 332 180 L 402 256 L 332 332" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- AI Spark Pulse Dot -->
    <circle cx="388" cy="180" r="14" fill="#0AE98A"/>
    <circle cx="124" cy="332" r="10" fill="#00D9FF"/>
  </g>
</svg>
