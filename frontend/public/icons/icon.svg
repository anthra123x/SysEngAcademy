<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121E"/>
      <stop offset="50%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="50%" stop-color="#0AE98A"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#neon)" stroke-width="12" stroke-opacity="0.85"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#00E599" fill-opacity="0.12"/>

  <!-- SysEng Code Symbol </> with Bold Legible Strokes -->
  <g filter="url(#glow)">
    <!-- < -->
    <path d="M 185 168 L 105 256 L 185 344" 
          fill="none" 
          stroke="url(#neon)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- / -->
    <line x1="288" y1="148" x2="224" y2="364" 
          stroke="#00D9FF" 
          stroke-width="38" 
          stroke-linecap="round"/>

    <!-- > -->
    <path d="M 327 168 L 407 256 L 327 344" 
          fill="none" 
          stroke="url(#neon)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- AI Spark Pulse Accents -->
    <circle cx="396" cy="168" r="18" fill="#00E599"/>
    <circle cx="116" cy="344" r="14" fill="#00D9FF"/>
  </g>
</svg>
