<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121E"/>
      <stop offset="50%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <linearGradient id="brandGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0AE98A"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>

    <filter id="neonGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradMask)"/>
  <circle cx="256" cy="256" r="160" fill="#0AE98A" fill-opacity="0.08"/>

  <!-- Scaled content inside safe zone (within center 80%) -->
  <g transform="translate(51.2, 51.2) scale(0.8)" filter="url(#neonGlowMask)">
    <!-- Left Bracket < -->
    <path d="M 180 180 L 110 256 L 180 332" 
          fill="none" 
          stroke="url(#brandGradMask)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Slash / -->
    <line x1="280" y1="160" x2="232" y2="352" 
          stroke="#00D9FF" 
          stroke-width="32" 
          stroke-linecap="round"/>

    <!-- Right Bracket > -->
    <path d="M 332 180 L 402 256 L 332 332" 
          fill="none" 
          stroke="url(#brandGradMask)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- AI Spark Pulse Dot -->
    <circle cx="388" cy="180" r="16" fill="#0AE98A"/>
    <circle cx="124" cy="332" r="12" fill="#00D9FF"/>
  </g>
</svg>
